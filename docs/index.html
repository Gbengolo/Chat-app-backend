<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Group 19 Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root {
    --bg: #12141a; --panel: #1a1d25; --panel2: #15171e; --border: #262a35;
    --text: #eef0f3; --muted: #8890a0; --accent: #4fd1a5; --danger: #f87171;
    --bubble-me: #22304a; --bubble-them: #1f2330;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  input, button { font-family: inherit; font-size: 0.95rem; }
  button { cursor: pointer; }

  /* ---- Auth screen ---- */
  #auth { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card {
    width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 28px;
  }
  .auth-card h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .auth-card p.sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; background: var(--panel2); border-radius: 8px; padding: 4px; }
  .tabs button {
    flex: 1; background: transparent; border: none; color: var(--muted); padding: 8px; border-radius: 6px;
  }
  .tabs button.active { background: var(--panel); color: var(--text); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 7px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%; background: var(--accent); color: #0b1510; border: none; font-weight: 600;
    padding: 11px; border-radius: 7px; margin-top: 6px;
  }
  .err { color: var(--danger); font-size: 0.82rem; min-height: 18px; margin-top: 8px; }
  .api-note { color: var(--muted); font-size: 0.72rem; margin-top: 18px; word-break: break-all; }

  /* ---- App screen ---- */
  #app { flex: 1; display: none; min-height: 0; }
  #app.visible { display: flex; }
  #sidebar {
    width: 290px; min-width: 220px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #sidebar header {
    padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex;
    justify-content: space-between; align-items: center;
  }
  #sidebar header .me { font-weight: 600; font-size: 0.95rem; }
  #sidebar header .me small { display: block; color: var(--muted); font-weight: 400; font-size: 0.72rem; }
  #logout { background: none; border: none; color: var(--muted); font-size: 0.78rem; }
  #newConvo { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
  #newConvo input {
    flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 9px; border-radius: 6px; font-size: 0.8rem; outline: none;
  }
  #newConvo button { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 0 10px; }
  #convoList { flex: 1; overflow-y: auto; }
  .convo-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex;
    align-items: center; gap: 8px;
  }
  .convo-item:hover { background: var(--panel2); }
  .convo-item.active { background: var(--panel2); border-left: 3px solid var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; flex-shrink: 0; }
  .dot.online { background: var(--accent); }
  .convo-id { font-size: 0.78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chatHeader { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 0.9rem; color: var(--muted); }
  #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.9rem; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 65%; padding: 9px 13px; border-radius: 10px; font-size: 0.88rem; line-height: 1.4; }
  .msg.me { align-self: flex-end; background: var(--bubble-me); }
  .msg.them { align-self: flex-start; background: var(--bubble-them); }
  .msg .meta { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
  #typingRow { padding: 0 18px; height: 20px; font-size: 0.78rem; color: var(--muted); }
  #composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  #composer input {
    flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; outline: none;
  }
  #composer button { background: var(--accent); color: #0b1510; border: none; font-weight: 600; padding: 0 18px; border-radius: 8px; }

  @media (max-width: 640px) {
    #app.visible { flex-direction: row; }
    #sidebar { width: 100%; }
    #app.chat-open #sidebar { display: none; }
    #app:not(.chat-open) #chat { display: none; }
    #backBtn { display: inline-block !important; }
  }
  #backBtn { display: none; background: none; border: none; color: var(--accent); margin-right: 10px; }
</style>
</head>
<body>

<div id="auth">
  <div class="auth-card">
    <h1>Group 19 Chat</h1>
    <p class="sub">Real-time chat backend demo</p>
    <div class="tabs">
      <button id="tabLogin" class="active">Log in</button>
      <button id="tabRegister">Register</button>
    </div>
    <div id="regFields" style="display:none">
      <div class="field"><label>Username</label><input id="regUsername" autocomplete="username"></div>
    </div>
    <div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div>
    <div class="field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password"></div>
    <button class="btn-primary" id="authSubmit">Log in</button>
    <div class="err" id="authErr"></div>
    <div class="api-note">API: <span id="apiUrlLabel"></span></div>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <header>
      <div class="me"><span id="meName">—</span><small id="meEmail"></small></div>
      <button id="logout">Log out</button>
    </header>
    <div id="newConvo">
      <input id="participantId" placeholder="Other user's ID">
      <button id="startConvo">Start</button>
    </div>
    <div id="convoList"></div>
  </div>
  <div id="chat">
    <div id="empty">Select or start a conversation</div>
  </div>
</div>

<script>
(function () {
  const API = "https://chat-app-backend-ukcp.onrender.com";
  document.getElementById("apiUrlLabel").textContent = API;

  let token = null, me = null, socket = null;
  let conversations = [];
  let activeConvo = null;
  let onlineUsers = new Set();
  let typingTimeout = null;

  try { token = localStorage.getItem("gchat_token"); me = JSON.parse(localStorage.getItem("gchat_me") || "null"); } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const authScreen = $("auth"), appScreen = $("app");

  function showApp() {
    authScreen.style.display = "none";
    appScreen.classList.add("visible");
    $("meName").textContent = me.username;
    $("meEmail").textContent = me.email;
    connectSocket();
    loadConversations();
  }

  if (token && me) showApp();

  // ---- Auth tabs ----
  let mode = "login";
  $("tabLogin").onclick = () => { mode = "login"; $("tabLogin").classList.add("active"); $("tabRegister").classList.remove("active"); $("regFields").style.display = "none"; $("authSubmit").textContent = "Log in"; $("authErr").textContent = ""; };
  $("tabRegister").onclick = () => { mode = "register"; $("tabRegister").classList.add("active"); $("tabLogin").classList.remove("active"); $("regFields").style.display = "block"; $("authSubmit").textContent = "Create account"; $("authErr").textContent = ""; };

  $("authSubmit").onclick = async () => {
    const email = $("authEmail").value.trim();
    const password = $("authPassword").value;
    const errEl = $("authErr");
    errEl.textContent = "";
    if (!email || !password) { errEl.textContent = "Email and password are required."; return; }
    try {
      let body, url;
      if (mode === "register") {
        const username = $("regUsername").value.trim();
        if (!username) { errEl.textContent = "Username is required."; return; }
        url = API + "/api/auth/register";
        body = { username, email, password };
      } else {
        url = API + "/api/auth/login";
        body = { email, password };
      }
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok || !data.success) { errEl.textContent = data.message || "Something went wrong."; return; }
      token = data.data.token; me = data.data.user;
      try { localStorage.setItem("gchat_token", token); localStorage.setItem("gchat_me", JSON.stringify(me)); } catch (e) {}
      showApp();
    } catch (e) {
      errEl.textContent = "Could not reach the server. It may be waking up, try again in a moment.";
    }
  };

  $("logout").onclick = () => {
    try { localStorage.removeItem("gchat_token"); localStorage.removeItem("gchat_me"); } catch (e) {}
    if (socket) socket.disconnect();
    location.reload();
  };

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      ...opts,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token, ...(opts.headers || {}) }
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  async function loadConversations() {
    const { ok, data } = await api("/api/conversations");
    if (ok) { conversations = data.data || []; renderConvoList(); }
  }

  function renderConvoList() {
    const list = $("convoList");
    list.innerHTML = "";
    conversations.forEach((c) => {
      const otherId = c.participants.find((p) => p !== me.id) || c.participants[0];
      const row = document.createElement("div");
      row.className = "convo-item" + (activeConvo && activeConvo._id === c._id ? " active" : "");
      row.innerHTML = `<span class="dot${onlineUsers.has(otherId) ? " online" : ""}"></span><span class="convo-id">${otherId}</span>`;
      row.onclick = () => openConvo(c);
      list.appendChild(row);
    });
  }

  $("startConvo").onclick = async () => {
    const participantId = $("participantId").value.trim();
    if (!participantId) return;
    const { ok, data } = await api("/api/conversations", { method: "POST", body: JSON.stringify({ participantId }) });
    if (ok) {
      $("participantId").value = "";
      await loadConversations();
      const c = conversations.find((x) => x._id === data.data._id) || data.data;
      openConvo(c);
    } else {
      alert(data.message || "Could not start conversation.");
    }
  };

  function buildChatUI() {
    $("chat").innerHTML = `
      <div id="chatHeader"><button id="backBtn">&larr;</button>Conversation</div>
      <div id="messages"></div>
      <div id="typingRow"></div>
      <div id="composer">
        <input id="msgInput" placeholder="Type a message">
        <button id="sendBtn">Send</button>
      </div>`;
    $("backBtn").onclick = () => appScreen.classList.remove("chat-open");
    $("sendBtn").onclick = sendMessage;
    $("msgInput").addEventListener("keydown", (e) => {
      if (socket && activeConvo) socket.emit("typing:start", activeConvo._id);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { if (socket && activeConvo) socket.emit("typing:stop", activeConvo._id); }, 1200);
      if (e.key === "Enter") sendMessage();
    });
  }

  async function openConvo(c) {
    activeConvo = c;
    appScreen.classList.add("chat-open");
    buildChatUI();
    if (socket) socket.emit("conversation:join", c._id);
    renderConvoList();
    const { ok, data } = await api(`/api/conversations/${c._id}/messages`);
    if (ok) renderMessages(data.data.slice().reverse());
  }

  function renderMessages(msgs) {
    const box = $("messages");
    if (!box) return;
    box.innerHTML = "";
    msgs.forEach(addMessageToDOM);
    box.scrollTop = box.scrollHeight;
  }

  function addMessageToDOM(m) {
    const box = $("messages");
    if (!box) return;
    const senderId = typeof m.senderId === "object" ? m.senderId._id : m.senderId;
    const div = document.createElement("div");
    div.className = "msg " + (senderId === me.id ? "me" : "them");
    const time = new Date(m.createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    div.innerHTML = `${escapeHtml(m.content)}<div class="meta">${time}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  async function sendMessage() {
    const input = $("msgInput");
    const content = input.value.trim();
    if (!content || !activeConvo) return;
    input.value = "";
    const { ok, data } = await api(`/api/conversations/${activeConvo._id}/messages`, { method: "POST", body: JSON.stringify({ content }) });
    if (ok) addMessageToDOM(data.data);
  }

  function connectSocket() {
    socket = io(API, { auth: { token } });
    socket.on("user:online", (id) => { onlineUsers.add(id); renderConvoList(); });
    socket.on("user:offline", (id) => { onlineUsers.delete(id); renderConvoList(); });
    socket.on("typing:start", (d) => {
      if (activeConvo && d.conversationId === activeConvo._id) $("typingRow") && ($("typingRow").textContent = "Typing…");
    });
    socket.on("typing:stop", (d) => {
      if (activeConvo && d.conversationId === activeConvo._id) $("typingRow") && ($("typingRow").textContent = "");
    });
  }
})();
</script>
</body>
</html>
